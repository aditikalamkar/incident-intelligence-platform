@if (auth.user(); as user) {
  <header class="topbar">
    <a class="brand" routerLink="/">OpsPilot</a>
    <span
      class="connection"
      [attr.data-status]="stream.status()"
      role="status"
      title="Live updates: changes appear without reloading"
    >
      {{ streamLabel() }}
    </span>
    <span class="spacer"></span>
    <span class="user">{{ user.name }}</span>
    <button type="button" class="button" (click)="auth.logout()">Sign out</button>
  </header>
}

<main>
  <router-outlet />
</main>
