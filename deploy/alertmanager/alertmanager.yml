# Sends every alert to OpsPilot. The API key is the one seeded by the "dev" profile.
route:
  receiver: opspilot
  group_by: [alertname, service]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: opspilot
    webhook_configs:
      - url: http://opspilot:8080/api/v1/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: opspilot-dev-key
