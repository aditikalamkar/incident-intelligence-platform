spring:
  application:
    name: opspilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opspilot}
    username: ${DB_USER:opspilot}
    password: ${DB_PASSWORD:opspilot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        # One thread per worker: outbox relay, escalation, notification dispatch
        size: 3

opspilot:
  security:
    jwt:
      # Base64-encoded, at least 256 bits. Generate with: openssl rand -base64 32
      secret: ${JWT_SECRET:}
  workers:
    enabled: true
    poll-interval: PT1S
    batch-size: 100
    max-attempts: 10
  ai:
    # The investigation assistant is on only when an Anthropic API key is set.
    # Incident data (alerts, timeline, comments) is then sent to the Anthropic API.
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5-5
    effort: medium
    max-concurrent: 4
    daily-limit-per-tenant: 100

management:
  server:
    # Actuator runs on its own port. /actuator/prometheus needs no login so Prometheus can scrape it,
    # so this port must stay internal: never publish it to the internet.
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        # Lets Prometheus compute latency percentiles per endpoint
        "[http.server.requests]": true

logging:
  pattern:
    # Every log line of an HTTP request carries its X-Request-Id
    correlation: "[%X{requestId:-}] "
