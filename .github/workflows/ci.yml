name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  # Builds the Docker image and runs the full demo: a real Prometheus alert flows through
  # Alertmanager into OpsPilot, gets escalated, and is auto-resolved when the service recovers.
  demo-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/smoke-test.sh
