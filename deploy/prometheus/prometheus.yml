# Short intervals so the demo reacts within seconds; production would use 15-60s.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: opspilot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [opspilot:8081]

  - job_name: payment-api
    static_configs:
      - targets: [payment-api:9100]
